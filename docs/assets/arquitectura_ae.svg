<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del autoencoder convolucional AE 1024</title>
  <desc id="desc">Diagrama capa por capa del autoencoder. Seis convoluciones comprimen una radiografía de 1024 por 1024 hasta 128 mapas de 16 por 16 y seis convoluciones transpuestas generan la reconstrucción.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="encoder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="decoder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="latent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
      .stage { font-size: 16px; font-weight: 700; fill: #fff; }
      .shape { font-size: 18px; font-weight: 700; fill: #fff; }
      .op { font-size: 12px; font-weight: 500; fill: #dbeafe; }
      .op-dec { font-size: 12px; font-weight: 500; fill: #d1fae5; }
      .params { font-size: 11px; fill: #bfdbfe; }
      .params-dec { font-size: 11px; fill: #a7f3d0; }
      .arrow-label { font-size: 11px; font-weight: 600; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>

  <text x="70" y="72" font-size="34" font-weight="800" fill="#0f172a">Arquitectura del autoencoder convolucional</text>
  <text x="70" y="105" font-size="17" fill="#475569">AE 1024×1024 · versión ae_1024_v1 · entrada y salida en escala de grises [0, 1]</text>

  <rect x="58" y="148" width="1148" height="342" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="1230" y="148" width="310" height="570" rx="22" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="58" y="516" width="1148" height="202" rx="22" fill="#ecfdf5" stroke="#a7f3d0"/>

  <text x="84" y="183" class="section" fill="#1d4ed8">CODIFICADOR · COMPRESIÓN</text>
  <text x="1258" y="183" class="section" fill="#6d28d9">CUELLO DE BOTELLA</text>
  <text x="84" y="551" class="section" fill="#047857">DECODIFICADOR · RECONSTRUCCIÓN</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="82" y="245" width="142" height="150" rx="16" fill="#334155"/>
  </g>
  <text x="153" y="278" text-anchor="middle" class="stage">Entrada x</text>
  <rect x="120" y="294" width="66" height="66" rx="5" fill="#cbd5e1" stroke="#fff" stroke-width="2"/>
  <path d="M128 347 Q145 318 155 338 T179 317" fill="none" stroke="#64748b" stroke-width="5" opacity=".8"/>
  <text x="153" y="383" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1×1024×1024</text>

  <!-- Encoder cards -->
  <g filter="url(#shadow)">
    <rect x="258" y="233" width="134" height="174" rx="16" fill="url(#encoder)"/>
    <rect x="426" y="233" width="134" height="174" rx="16" fill="url(#encoder)"/>
    <rect x="594" y="233" width="134" height="174" rx="16" fill="url(#encoder)"/>
    <rect x="762" y="233" width="134" height="174" rx="16" fill="url(#encoder)"/>
    <rect x="930" y="233" width="134" height="174" rx="16" fill="url(#encoder)"/>
    <rect x="1098" y="233" width="134" height="174" rx="16" fill="url(#encoder)"/>
  </g>

  <g text-anchor="middle">
    <text x="325" y="266" class="stage">Encoder 1</text>
    <text x="325" y="300" class="shape">8×512×512</text>
    <text x="325" y="329" class="op">Conv 1→8</text>
    <text x="325" y="348" class="op">k3 · s2 · p1</text>
    <text x="325" y="371" class="op">ReLU</text>
    <text x="325" y="393" class="params">80 parámetros</text>

    <text x="493" y="266" class="stage">Encoder 2</text>
    <text x="493" y="300" class="shape">16×256×256</text>
    <text x="493" y="329" class="op">Conv 8→16</text>
    <text x="493" y="348" class="op">k3 · s2 · p1</text>
    <text x="493" y="371" class="op">ReLU</text>
    <text x="493" y="393" class="params">1.168 parámetros</text>

    <text x="661" y="266" class="stage">Encoder 3</text>
    <text x="661" y="300" class="shape">32×128×128</text>
    <text x="661" y="329" class="op">Conv 16→32</text>
    <text x="661" y="348" class="op">k3 · s2 · p1</text>
    <text x="661" y="371" class="op">ReLU</text>
    <text x="661" y="393" class="params">4.640 parámetros</text>

    <text x="829" y="266" class="stage">Encoder 4</text>
    <text x="829" y="300" class="shape">64×64×64</text>
    <text x="829" y="329" class="op">Conv 32→64</text>
    <text x="829" y="348" class="op">k3 · s2 · p1</text>
    <text x="829" y="371" class="op">ReLU</text>
    <text x="829" y="393" class="params">18.496 parámetros</text>

    <text x="997" y="266" class="stage">Encoder 5</text>
    <text x="997" y="300" class="shape">128×32×32</text>
    <text x="997" y="329" class="op">Conv 64→128</text>
    <text x="997" y="348" class="op">k3 · s2 · p1</text>
    <text x="997" y="371" class="op">ReLU</text>
    <text x="997" y="393" class="params">73.856 parámetros</text>

    <text x="1165" y="266" class="stage">Encoder 6</text>
    <text x="1165" y="300" class="shape">128×16×16</text>
    <text x="1165" y="329" class="op">Conv 128→128</text>
    <text x="1165" y="348" class="op">k3 · s2 · p1</text>
    <text x="1165" y="371" class="op">ReLU</text>
    <text x="1165" y="393" class="params">147.584 parámetros</text>
  </g>

  <!-- Encoder arrows -->
  <g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)">
    <path d="M224 320 H251"/>
    <path d="M392 320 H419"/>
    <path d="M560 320 H587"/>
    <path d="M728 320 H755"/>
    <path d="M896 320 H923"/>
    <path d="M1064 320 H1091"/>
    <path d="M1232 320 H1274"/>
  </g>
  <g text-anchor="middle" class="arrow-label">
    <text x="409" y="307">÷2</text>
    <text x="577" y="307">÷2</text>
    <text x="745" y="307">÷2</text>
    <text x="913" y="307">÷2</text>
    <text x="1081" y="307">÷2</text>
  </g>

  <!-- Bottleneck -->
  <g filter="url(#shadow)">
    <rect x="1278" y="225" width="214" height="190" rx="20" fill="url(#latent)"/>
  </g>
  <text x="1385" y="264" text-anchor="middle" class="stage">Representación z</text>
  <text x="1385" y="307" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">128×16×16</text>
  <text x="1385" y="339" text-anchor="middle" font-size="14" fill="#ede9fe">32.768 valores</text>
  <text x="1385" y="365" text-anchor="middle" font-size="13" fill="#ddd6fe">32× menos elementos</text>
  <text x="1385" y="389" text-anchor="middle" font-size="13" fill="#ddd6fe">que la entrada</text>

  <!-- Turn into decoder -->
  <path d="M1385 415 V468 Q1385 488 1365 488 H1165 V565" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="1280" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">DECODIFICAR</text>

  <!-- Decoder cards, data flows right to left -->
  <g filter="url(#shadow)">
    <rect x="1098" y="572" width="134" height="120" rx="16" fill="url(#decoder)"/>
    <rect x="930" y="572" width="134" height="120" rx="16" fill="url(#decoder)"/>
    <rect x="762" y="572" width="134" height="120" rx="16" fill="url(#decoder)"/>
    <rect x="594" y="572" width="134" height="120" rx="16" fill="url(#decoder)"/>
    <rect x="426" y="572" width="134" height="120" rx="16" fill="url(#decoder)"/>
    <rect x="258" y="572" width="134" height="120" rx="16" fill="url(#decoder)"/>
  </g>

  <g text-anchor="middle">
    <text x="1165" y="600" class="stage">Decoder 1</text>
    <text x="1165" y="629" class="shape">128×32×32</text>
    <text x="1165" y="652" class="op-dec">ConvT 128→128 · k4/s2/p1</text>
    <text x="1165" y="676" class="params-dec">ReLU · 262.272 params.</text>

    <text x="997" y="600" class="stage">Decoder 2</text>
    <text x="997" y="629" class="shape">64×64×64</text>
    <text x="997" y="652" class="op-dec">ConvT 128→64 · k4/s2/p1</text>
    <text x="997" y="676" class="params-dec">ReLU · 131.136 params.</text>

    <text x="829" y="600" class="stage">Decoder 3</text>
    <text x="829" y="629" class="shape">32×128×128</text>
    <text x="829" y="652" class="op-dec">ConvT 64→32 · k4/s2/p1</text>
    <text x="829" y="676" class="params-dec">ReLU · 32.800 params.</text>

    <text x="661" y="600" class="stage">Decoder 4</text>
    <text x="661" y="629" class="shape">16×256×256</text>
    <text x="661" y="652" class="op-dec">ConvT 32→16 · k4/s2/p1</text>
    <text x="661" y="676" class="params-dec">ReLU · 8.208 params.</text>

    <text x="493" y="600" class="stage">Decoder 5</text>
    <text x="493" y="629" class="shape">8×512×512</text>
    <text x="493" y="652" class="op-dec">ConvT 16→8 · k4/s2/p1</text>
    <text x="493" y="676" class="params-dec">ReLU · 2.056 params.</text>

    <text x="325" y="600" class="stage">Salida</text>
    <text x="325" y="629" class="shape">1×1024×1024</text>
    <text x="325" y="652" class="op-dec">ConvT 8→1 · k4/s2/p1</text>
    <text x="325" y="676" class="params-dec">Sigmoid · 129 params.</text>
  </g>

  <!-- Decoder arrows -->
  <g fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)">
    <path d="M1098 632 H1071"/>
    <path d="M930 632 H903"/>
    <path d="M762 632 H735"/>
    <path d="M594 632 H567"/>
    <path d="M426 632 H399"/>
    <path d="M258 632 H218"/>
  </g>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="82" y="575" width="136" height="114" rx="16" fill="#ea580c"/>
  </g>
  <text x="150" y="603" text-anchor="middle" class="stage">Reconstrucción x̂</text>
  <rect x="122" y="616" width="56" height="48" rx="4" fill="#ffedd5" stroke="#fff" stroke-width="2"/>
  <path d="M129 654 Q143 632 153 645 T172 628" fill="none" stroke="#f97316" stroke-width="4" opacity=".75"/>
  <text x="150" y="681" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">valores [0, 1]</text>

  <!-- Summary -->
  <rect x="58" y="756" width="1482" height="100" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <line x1="486" y1="774" x2="486" y2="838" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="1008" y1="774" x2="1008" y2="838" stroke="#e2e8f0" stroke-width="2"/>

  <text x="82" y="791" font-size="13" font-weight="700" fill="#64748b">FUNCIÓN DE PÉRDIDA</text>
  <text x="82" y="826" font-size="24" font-weight="800" fill="#0f172a">L1 = media |x − x̂|</text>

  <text x="514" y="791" font-size="13" font-weight="700" fill="#64748b">DISEÑO</text>
  <text x="514" y="820" font-size="17" font-weight="700" fill="#0f172a">6 bajadas + 6 subidas · sin BatchNorm ni dropout</text>
  <text x="514" y="842" font-size="14" fill="#475569">ReLU en capas ocultas · sigmoid en la salida</text>

  <text x="1036" y="791" font-size="13" font-weight="700" fill="#64748b">TAMAÑO DEL MODELO</text>
  <text x="1036" y="826" font-size="24" font-weight="800" fill="#0f172a">682.425 parámetros entrenables</text>
</svg>
